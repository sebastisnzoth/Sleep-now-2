name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-capacitor
    paths:
      - 'Sleep-Now-main/**'
      - '.github/workflows/android-debug.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sleep-Now-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Sleep-Now-main/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Build debug APK
        working-directory: Sleep-Now-main/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sleep-now-debug-apk
          path: Sleep-Now-main/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
